<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 320 336"
  role="img"
  aria-labelledby="andi-svg-title andi-svg-description"
>
  <title id="andi-svg-title">Andi, el cóndor andino de Rumbo Vivo</title>
  <desc id="andi-svg-description">
    Un cóndor amistoso de plumaje gris oscuro, collar blanco, pico dorado y ojos
    cálidos. Sus alas naturales tienen pequeños detalles verdes que recuerdan el
    cuidado de la biodiversidad.
  </desc>
  <view id="retrato" viewBox="122 13 126 150" />
  <style>
    .andi-flight {
      transform-origin: 160px 288px;
      animation: andi-sway 6.8s ease-in-out infinite;
    }
    .andi-wing-left {
      transform-origin: 125px 164px;
      animation: andi-left 6.8s ease-in-out infinite;
    }
    .andi-wing-right {
      transform-origin: 207px 165px;
      animation: andi-right 6.8s ease-in-out infinite;
    }
    @keyframes andi-sway {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-2px);
      }
    }
    @keyframes andi-left {
      0%,
      100% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(2deg);
      }
    }
    @keyframes andi-right {
      0%,
      100% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(-2deg);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .andi-flight,
      .andi-wing-left,
      .andi-wing-right {
        animation: none;
      }
    }
  </style>
  <ellipse cx="163" cy="315" rx="65" ry="8" fill="#174d3a" opacity=".09" />
